<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page not found — All in 1 Events</title>
<meta name="robots" content="noindex"/>
<!-- Self-contained on purpose. This is the fallback for every missing path on
     the whole host, so it must not depend on a stylesheet that may itself be
     the thing that moved. -->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0e100f; color: #f4f3ef; }
  main { max-width: 36rem; padding: 2rem 1.5rem; text-align: center; }
  .k { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .75rem;
       letter-spacing: .18em; text-transform: uppercase; color: #9dc4a8; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.02em; margin: .6rem 0 1rem; }
  p { color: #b9bdb8; line-height: 1.6; margin: 0 0 2rem; }
  nav { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
  a { display: inline-block; padding: .85rem 1.6rem; border-radius: 999px;
      font-size: .8rem; letter-spacing: .14em; text-transform: uppercase;
      text-decoration: none; color: #f4f3ef; border: 1px solid rgba(244,243,239,.3); }
  a.primary { background: #f4f3ef; color: #0e100f; border-color: #f4f3ef; }
  a:focus-visible { outline: 2px solid #9dc4a8; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="k">404</p>
  <h1>That page is not here.</h1>
  <p>It may have moved, or the link was wrong. Both of our front doors are below.</p>
  <nav aria-label="Where to go instead">
    <a class="primary" href="/">All in 1 Events</a>
    <a href="/420-friendly/">420 Friendly</a>
  </nav>
</main>
</body>
</html>
