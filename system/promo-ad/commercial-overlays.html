<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Hanken Grotesk"; src: url(fonts/hanken-grotesk-var-latin.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Inter"; src: url(fonts/inter-var-latin.woff2) format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; color: #fff; font-family: Inter, sans-serif; }
.layer { position: absolute; inset: 0; display: none; }
body.lower #lower, body.end #end { display: block; }
#lower .pill { position: absolute; left: 56px; bottom: 52px; display: flex; align-items: center; gap: 18px; padding: 14px 30px 14px 18px; border-radius: 999px;
  background: rgba(11,18,34,.82); box-shadow: 0 0 0 2px rgba(148,163,184,.28), 0 14px 40px rgba(0,0,0,.45); font-weight: 700; font-size: 30px; letter-spacing: .01em; }
#lower img { height: 46px; }
#lower .dot { color: #60a5fa; }
#end .block { position: absolute; left: 0; right: 0; top: 735px; display: flex; flex-direction: column; align-items: center; }
#end .cta { padding: 20px 44px; background: #2563eb; border-radius: 14px; font-family: "Hanken Grotesk"; font-weight: 800; font-size: 38px; letter-spacing: .02em; box-shadow: 0 16px 40px rgba(37,99,235,.35); }
#end .web { margin-top: 30px; font-family: "Hanken Grotesk"; font-weight: 800; font-size: 50px; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
#end .line { margin-top: 10px; font-size: 36px; font-weight: 600; color: #e2e8f0; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
#end .line b { color: #60a5fa; font-weight: 700; margin-right: 10px; }
#end .line .sep { color: #64748b; margin: 0 22px; }
</style></head><body>
<div class="layer" id="lower"><div class="pill"><img src="img/meridian-mark.png" alt=""><span>meridianinterface.com</span><span class="dot">·</span><span>281-882-9198</span></div></div>
<div class="layer" id="end"><div class="block">
  <div class="cta">Book your 1-on-1 appointment</div>
  <div class="web">meridianinterface.com</div>
  <div class="line"><b>Call</b>281-882-9198<span class="sep">|</span><b>Email</b>otis@meridianinterface.com</div>
</div></div>
</body></html>
