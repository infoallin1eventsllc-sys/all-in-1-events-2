<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// "Ribbon Zipper": Otis's real mark on white. The two halves dissolve into ribbons that ripple apart like silk,
// then zip back together from the bottom up while light climbs the centre line with the lock front.
// The logo file is only sliced and moved, never redrawn or recolored. 8 s seamless loop.
const Q=new URLSearchParams(location.search);
const W=+Q.get('w')||1080,H=+Q.get('h')||1080,MW=+(Q.get('mw')||460),CY=+(Q.get('cy')||0.46);
const c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');
const img=new Image();img.src='mark.png';
const IW=342,IH=333,LC=163,RC=179,L0=165,L1=177;           // halves cut 2px clear of the line
const S=MW/IW,MH=IH*S,X0=W/2-MW/2,Y0=H*CY-MH/2,N=333;      // one ribbon per source pixel row: smooth curves
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>{x=cl(x);return x*x*x*(x*(6*x-15)+10)};
const T=8;
// offscreen layers
const mk=()=>{const o=document.createElement('canvas');o.width=W;o.height=H;return [o,o.getContext('2d')]};
const [mc,m]=mk(),[lc,l]=mk();

function sep(t,yn){ // horizontal travel (in mark widths) of the ribbon at normalised height yn (0 top .. 1 bottom)
  const out=sm((t-0.7-yn*0.55)/1.5);                // part: top ribbons leave first, a ripple down the mark
  const back=sm((t-3.55-(1-yn)*1.25)/1.15);         // return: bottom ribbons lock first, the zip climbs
  const open=out*(1-back);
  const wave=Math.sin(2*Math.PI*(t*0.62)-yn*5.2)*0.045+Math.sin(2*Math.PI*(t*0.31)+yn*2.6)*0.025;
  return open*(0.30+wave);
}
function zipFront(t){return cl((t-3.55)/(1.25+1.15))}   // how far up the lock has climbed (0..1)

function drawMark(t){
  m.clearRect(0,0,W,H);
  let any=false;const rows=[];
  for(let i=0;i<N;i++){const yn=(i+.5)/N,d=sep(t,yn);rows.push(d);if(Math.abs(d)>0.0008)any=true;}
  if(!any){m.drawImage(img,X0,Y0,MW,MH);return 0;}
  const sh=IH/N;
  for(let i=0;i<N;i++){
    const d=rows[i]*MW,sy=i*sh,dy=Y0+sy*S,dh=sh*S+0.8,shh=Math.min(sh+0.6,IH-sy);
    const squeeze=1-Math.abs(rows[i])*0.35;                 // ribbons narrow as they turn away, like fabric in wind
    const lw=LC*S*squeeze,rw=(IW-RC)*S*squeeze;
    m.drawImage(img,0,sy,LC,shh,X0+LC*S-lw-d,dy,lw,dh);
    m.drawImage(img,RC,sy,IW-RC,shh,X0+RC*S+d,dy,rw,dh);
  }
  m.drawImage(img,L0,0,L1-L0,IH,X0+L0*S,Y0,(L1-L0)*S,MH);    // the centre line never moves
  return 1;
}

function lineLight(t){ // 0..1 lit height from the bottom, and overall glow strength
  const z=zipFront(t);
  const lit=sm(z*1.08);
  const peak=sm((t-5.9)/0.35)*(1-sm((t-6.5)/1.3));
  const glow=Math.max(cl(z*1.2)*(1-sm((t-6.5)/1.3)),0)*(t<3.55?0:1);
  return {lit,glow,peak,head:z>0&&z<1?z:-1};
}

window.render=function(t){
  t=((t%T)+T)%T;
  // white ground with a soft studio falloff and a faint floor
  const bg=g.createRadialGradient(W/2,H*CY,10,W/2,H*CY,Math.max(W,H)*0.75);
  bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#eceff4');g.fillStyle=bg;g.fillRect(0,0,W,H);
  drawMark(t);
  const floor=Y0+MH+MW*0.06;
  // contact shadow (widens as the ribbons part)
  const open=Math.abs(sep(t,0.95));
  g.save();g.translate(W/2,floor);g.scale(1,0.09);
  const sg=g.createRadialGradient(0,0,0,0,0,MW*(0.62+open*1.2));
  sg.addColorStop(0,'rgba(20,30,55,.20)');sg.addColorStop(1,'rgba(20,30,55,0)');g.fillStyle=sg;
  g.beginPath();g.arc(0,0,MW*(0.62+open*1.2),0,7);g.fill();g.restore();
  // reflection on the white floor
  g.save();g.globalAlpha=0.10;g.translate(0,floor*2-MW*0.02);g.scale(1,-1);g.drawImage(mc,0,0);g.restore();
  const fade=g.createLinearGradient(0,floor,0,floor+MH*0.55);
  fade.addColorStop(0,'rgba(246,248,251,0)');fade.addColorStop(1,'rgba(242,244,248,1)');
  g.fillStyle=fade;g.fillRect(0,floor,W,H-floor);
  // the mark with a soft drop shadow
  g.save();g.shadowColor='rgba(15,25,50,.22)';g.shadowBlur=MW*0.07;g.shadowOffsetY=MW*0.035;g.drawImage(mc,0,0);g.restore();

  // centre line lights up, climbing with the zip
  const {lit,glow,peak,head}=lineLight(t);
  if(glow>0.002||peak>0.002){
    const lx=X0+(L0+L1)/2*S,top=Y0+MH*0.005,bot=Y0+MH*0.995,ytop=bot-(bot-top)*lit,lwid=(L1-L0)*S;
    // blue halo around the lit part
    g.save();g.globalCompositeOperation='multiply';
    const hb=g.createLinearGradient(lx-lwid*4.5,0,lx+lwid*4.5,0);
    const a=.30*glow+.25*peak;
    hb.addColorStop(0,'rgba(255,255,255,1)');hb.addColorStop(.5,`rgba(${255-150*a|0},${255-95*a|0},255,1)`);hb.addColorStop(1,'rgba(255,255,255,1)');
    g.fillStyle=hb;g.filter=`blur(${lwid*1.2}px)`;g.fillRect(lx-lwid*4.5,ytop,lwid*9,bot-ytop);g.restore();
    // the line itself fills with light (masked to the line's own pixels)
    l.clearRect(0,0,W,H);l.globalCompositeOperation='source-over';
    l.drawImage(img,L0,0,L1-L0,IH,X0+L0*S,Y0,lwid,MH);l.globalCompositeOperation='source-in';
    const lg=l.createLinearGradient(0,ytop,0,bot);
    lg.addColorStop(0,`rgba(255,255,255,${.95*glow+peak*.05})`);lg.addColorStop(.25,`rgba(170,205,255,${.85*glow})`);lg.addColorStop(1,`rgba(37,99,235,${.75*glow})`);
    l.fillStyle=lg;l.fillRect(0,ytop,W,bot-ytop);l.globalCompositeOperation='source-over';
    g.drawImage(lc,0,0);
    // the travelling spark at the zip front, with a thin horizontal flare
    if(head>=0){const hy=bot-(bot-top)*sm(head*1.08);
      const sp=g.createRadialGradient(lx,hy,0,lx,hy,MW*0.09);
      sp.addColorStop(0,'rgba(255,255,255,1)');sp.addColorStop(.25,'rgba(150,195,255,.85)');sp.addColorStop(1,'rgba(37,99,235,0)');
      g.fillStyle=sp;g.beginPath();g.arc(lx,hy,MW*0.09,0,7);g.fill();
      const fl=g.createLinearGradient(lx-MW*0.4,0,lx+MW*0.4,0);
      fl.addColorStop(0,'rgba(37,99,235,0)');fl.addColorStop(.5,'rgba(90,150,255,.55)');fl.addColorStop(1,'rgba(37,99,235,0)');
      g.fillStyle=fl;g.fillRect(lx-MW*0.4,hy-1.2,MW*0.8,2.4);}
    // when the zip completes, one wash of light runs across the whole M
    if(peak>0.002){
      l.clearRect(0,0,W,H);l.globalCompositeOperation='source-over';l.drawImage(mc,0,0);l.globalCompositeOperation='source-in';
      const p=sm((t-5.85)/1.1),cx=X0-MW*0.3+p*MW*1.6;
      const sw=l.createLinearGradient(cx-MW*0.22,0,cx+MW*0.22,0);
      sw.addColorStop(0,'rgba(255,255,255,0)');sw.addColorStop(.5,`rgba(255,255,255,${.55*peak})`);sw.addColorStop(1,'rgba(255,255,255,0)');
      l.fillStyle=sw;l.fillRect(0,0,W,H);l.globalCompositeOperation='source-over';g.drawImage(lc,0,0);
    }
  }
};
img.onload=()=>{window.ready=true;render(0)};
</script>
