<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:HK;src:url(hk.woff2);font-weight:100 900}
@font-face{font-family:IN;src:url(in.woff2);font-weight:100 900}
html,body{margin:0;overflow:hidden;background:#0d1b3d}
#st{position:absolute;inset:0;overflow:hidden}
.c{position:absolute;left:0;right:0;text-align:center}
</style></head><body><div id="st"></div><script>
// One page for the 4:5, 1:1 and 16:9 versions: the generated clip (crop or card on navy),
// the push-in melt, then the quiet Meridian ending laid out for the shape.
const Q=new URLSearchParams(location.search), W=+Q.get('w'), H=+Q.get('h'), MODE=Q.get('mode'), CY=+(Q.get('cy')||0), CARD=+(Q.get('card')||960);
document.body.style.width=W+'px';document.body.style.height=H+'px';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), se=x=>.5-.5*Math.cos(Math.PI*cl(x)), seg=(t,a,b)=>cl((t-a)/(b-a));
const st=document.getElementById('st'), CX=W/2, DY=(H-772)/2-358; // content block is 772 px tall (logo top to contact line)
function ending(te){
 const L=se(seg(te,1.15,3.15)), G=se(seg(te,1.6,3.0))*(1-.45*se(seg(te,3.0,4.6))), Wd=se(seg(te,2.1,3.3)), it=s=>se(seg(te,s,s+.9));
 const tg=it(3.3), bt=it(3.75), ct=it(4.2), drift=1+.012*seg(te,1.2,6.7);
 return `<div style="position:absolute;inset:0;transform:scale(${drift});transform-origin:50% ${(478+DY)/H*100}%">
  <div style="position:absolute;left:${CX}px;top:${478+DY}px;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;background:radial-gradient(closest-side,rgba(80,140,255,${.42*G}),rgba(37,99,235,${.16*G}) 45%,rgba(37,99,235,0) 100%)"></div>
  <img src="mark.png" style="position:absolute;left:${CX-123}px;top:${358+DY+(1-L)*26}px;width:246px;height:240px;opacity:${L};transform:scale(${.95+.05*L});filter:drop-shadow(0 10px 40px rgba(0,0,0,.45))">
  <div class="c" style="top:${652+DY+(1-Wd)*16}px;opacity:${Wd};font:800 62px/1 HK;letter-spacing:.2em;color:#f3f6fc;padding-left:.2em">MERIDIAN</div>
  <div class="c" style="top:${730+DY+(1-Wd)*16}px;opacity:${Wd*.95};font:500 27px/1 IN;letter-spacing:.42em;color:#cbd5e1;padding-left:.42em">INTERFACE</div>
  <div class="c" style="top:${866+DY+(1-tg)*14}px;opacity:${tg};font:500 40px/1 IN;color:#eef2fb">We put the future in your hands.</div>
  <div class="c" style="top:${946+DY+(1-bt)*14}px;opacity:${bt}"><span style="display:inline-block;background:#2563eb;border-radius:60px;padding:24px 52px;font:700 34px/1 IN;color:#fff;box-shadow:0 14px 50px rgba(37,99,235,.5)">Book your free 1-on-1 appointment</span></div>
  <div class="c" style="top:${1098+DY+(1-ct)*14}px;opacity:${ct};font:600 32px/1 IN;letter-spacing:.04em;color:#e6ecf8">meridianinterface.com &nbsp;&nbsp;·&nbsp;&nbsp; 281-882-9198</div></div>`;}
window.render=async f=>{
 const P0=200,X0=213,XN=30,AN=242, z=se((f-P0)/(AN-P0)), e=f<X0?0:se((f-X0)/XN), ai=Math.min(f,AN), te=(f-X0)/24, T=f/24;
 let h=`<img src="plate.jpg" style="position:absolute;left:0;top:0;width:${W}px;height:${H}px;object-fit:cover;object-position:50% 40%;transform:scale(${1.04-.03*cl(T/15.5)})">`;
 if(e<1){const src=`A/${String(ai).padStart(4,'0')}.png`;
  if(MODE==='crop') h+=`<div style="position:absolute;inset:0;transform:scale(${1+.09*z});filter:brightness(${1-.35*e});opacity:${1-e}"><img src="${src}" style="position:absolute;left:${(W-1080)/2}px;top:${-CY}px;width:1080px;height:1920px"></div>`;
  else {const cw=CARD*9/16; h+=`<div style="position:absolute;left:${CX-cw/2}px;top:${(H-CARD)/2}px;width:${cw}px;height:${CARD}px;border-radius:26px;overflow:hidden;transform:scale(${1+.09*z});filter:brightness(${1-.35*e});opacity:${1-e};box-shadow:0 0 0 1.5px rgba(205,218,255,.28),0 40px 90px rgba(0,0,0,.55)"><img src="${src}" style="width:100%;height:100%;display:block"></div>`;}}
 if(te>=0) h+=ending(te);
 st.innerHTML=h; await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));};
</script></body></html>
