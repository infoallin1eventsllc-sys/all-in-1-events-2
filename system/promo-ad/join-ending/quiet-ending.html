<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:HK;src:url(hk.woff2);font-weight:100 900}
@font-face{font-family:IN;src:url(in.woff2);font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0d1b3d}
#st{position:absolute;inset:0}
.plate{position:absolute;inset:0;width:1080px;height:1920px}
.c{position:absolute;left:0;right:0;text-align:center}
</style></head><body><div id="st"></div><script>
// Meridian ending, no music of its own. Logo eases in slowly, then the appointment details.
// Content stays between y 300 and 1180 (9:16 safe zone: clear of the top 270 and bottom 670).
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), se=x=>.5-.5*Math.cos(Math.PI*cl(x)), seg=(t,a,b)=>cl((t-a)/(b-a));
const st=document.getElementById('st');
window.render=async te=>{
 const L=se(seg(te,1.15,3.15)), G=se(seg(te,1.6,3.0))*(1-.45*se(seg(te,3.0,4.6))), W=se(seg(te,2.1,3.3));
 const it=(s,d=.9)=>se(seg(te,s,s+d));
 const tg=it(3.3), bt=it(3.75), ct=it(4.2);
 const drift=1+.012*seg(te,1.2,6.7);
 st.innerHTML=`<img class="plate" src="plate.jpg" style="transform:scale(${1.04-.03*seg(te,0,6.7)})">
 <div style="position:absolute;inset:0;transform:scale(${drift});transform-origin:50% 40%">
  <div style="position:absolute;left:540px;top:478px;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;background:radial-gradient(closest-side,rgba(80,140,255,${.42*G}),rgba(37,99,235,${.16*G}) 45%,rgba(37,99,235,0) 100%)"></div>
  <img src="mark.png" style="position:absolute;left:${540-123}px;top:${358+(1-L)*26}px;width:246px;height:240px;opacity:${L};transform:scale(${.95+.05*L});filter:drop-shadow(0 10px 40px rgba(0,0,0,.45))">
  <div class="c" style="top:${652+(1-W)*16}px;opacity:${W};font:800 62px/1 HK;letter-spacing:.2em;color:#f3f6fc;padding-left:.2em">MERIDIAN</div>
  <div class="c" style="top:${730+(1-W)*16}px;opacity:${W*.95};font:500 27px/1 IN;letter-spacing:.42em;color:#cbd5e1;padding-left:.42em">INTERFACE</div>
  <div class="c" style="top:${866+(1-tg)*14}px;opacity:${tg};font:500 40px/1 IN;color:#eef2fb">We put the future in your hands.</div>
  <div class="c" style="top:${946+(1-bt)*14}px;opacity:${bt}"><span style="display:inline-block;background:#2563eb;border-radius:60px;padding:24px 52px;font:700 34px/1 IN;color:#fff;box-shadow:0 14px 50px rgba(37,99,235,.5)">Book your free 1-on-1 appointment</span></div>
  <div class="c" style="top:${1098+(1-ct)*14}px;opacity:${ct};font:600 32px/1 IN;letter-spacing:.04em;color:#e6ecf8">meridianinterface.com &nbsp;&nbsp;·&nbsp;&nbsp; 281-882-9198</div>
 </div>`;
 await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));};
</script></body></html>
