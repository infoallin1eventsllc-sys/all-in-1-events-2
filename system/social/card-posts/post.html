<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:H;src:url(hanken-grotesk-var-latin.woff2);font-weight:100 900}
@font-face{font-family:I;src:url(inter-var-latin.woff2);font-weight:100 900}
html,body{margin:0}
body{width:var(--w);height:var(--h);background:radial-gradient(120% 80% at 50% 35%,#fff 0%,#f3f5f9 60%,#e9edf3 100%);font-family:I;color:#0d1b3d;position:relative;overflow:hidden}
.card{position:absolute;border-radius:44px;overflow:hidden;box-shadow:0 40px 90px rgba(13,27,61,.28),0 8px 22px rgba(13,27,61,.16)}
.card img{display:block;width:100%;height:100%}
.txt{position:absolute}
.k{font:600 22px/1 I;letter-spacing:.32em;color:#2563eb;text-transform:uppercase}
.h{font:800 58px/1.05 H;letter-spacing:-.01em;margin:22px 0 0}
.p{font:400 27px/1.45 I;color:#45526e;margin:24px 0 0}
.u{font:700 30px/1 H;color:#0d1b3d;margin:34px 0 0;letter-spacing:.01em}
.u2{font:700 34px/1 H;text-align:center;width:100%;letter-spacing:.01em}
.s{font:400 24px/1 I;color:#5b6884;text-align:center;width:100%;margin-top:14px}
</style><body><div class="card" id="c"><img id="i"></div><div class="txt" id="t"></div>
<script>
const q=new URLSearchParams(location.search),W=+q.get('w'),H=+q.get('h'),src=q.get('src'),qr=q.get('qr')==='1';
document.body.style.setProperty('--w',W+'px');document.body.style.setProperty('--h',H+'px');
const c=document.getElementById('c'),t=document.getElementById('t');document.getElementById('i').src=src;
const A=844/390;
if(H/W>1.5){ // 9:16 story: card centred inside the safe area, address underneath
  const ch=1200,cw=ch/A;Object.assign(c.style,{height:ch+'px',width:cw+'px',left:(W-cw)/2+'px',top:'250px'});
  Object.assign(t.style,{left:0,width:W+'px',top:(250+ch+64)+'px'});
  t.innerHTML=`<div class="u2">meridianinterface.com/card</div><div class="s">${qr?'Scan the code or tap the link':'Tap the link to call, email or book'}</div>`;
}else{ // 4:5 feed: card on the left, words on the right
  const ch=1170,cw=ch/A;Object.assign(c.style,{height:ch+'px',width:cw+'px',left:'84px',top:(H-ch)/2+'px'});
  const x=84+cw+60;Object.assign(t.style,{left:x+'px',width:(W-x-60)+'px',top:'0',height:H+'px',display:'flex',flexDirection:'column',justifyContent:'center'});
  t.innerHTML=`<div class="k">Digital card</div><div class="h">Everything in one tap.</div><div class="p">${qr?'Scan the code with your phone camera to open my card.':'Call, email, book a free <span style="white-space:nowrap">1-on-1</span> or follow Meridian Interface.'}</div><div class="u">meridianinterface.com/card</div>`;
}
</script>
