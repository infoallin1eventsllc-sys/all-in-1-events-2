<style>
/* Layout: Otis's digital card (layout 1) in a phone frame, its background drawn live; a small switcher below. Single dark look on purpose (the card's own blue). */
:root{
  --stage:#070d24; --stage-2:#0d1838; --top:#003cb5; --ink:#141a52; --acc:#2563eb;
  --white:#ffffff; --soft:#dbe5f5; --muted:#9fb0cf; --chip:#16224a; --chip-on:#ffffff;
  --display:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(90% 70% at 50% 30%,var(--stage-2),var(--stage));color:var(--white);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.phone{position:relative;width:min(100%,400px,calc((100svh - 190px) * 390 / 844));min-width:min(100%,300px);aspect-ratio:390/844;max-width:100%;border-radius:34px;overflow:hidden;background:var(--top);
  box-shadow:0 0 0 10px #0b1130,0 0 0 11px #26305a,0 40px 80px rgba(0,0,0,.55)}
@media (max-width:480px){.phone{width:100%;box-shadow:0 30px 60px rgba(0,0,0,.5);border-radius:26px}}
canvas,.photo{position:absolute;inset:0;width:100%;height:100%}
.photo{overflow:hidden}
.photo .img{position:absolute;inset:-6%;background:url(ribbon.jpg) 50% 0/auto 112% no-repeat;will-change:transform}
.photo .glow{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
.card{position:relative;height:100%;display:flex;flex-direction:column;pointer-events:none}
.card a{pointer-events:auto}
.content{padding:30px 18px 0;display:grid;justify-items:center;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:10px}
.logo img{width:70px;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.logo b{display:block;font:800 19px/1 var(--display);letter-spacing:.2em;padding-left:.2em}
.logo span{display:block;margin-top:5px;font:700 10.5px/1 var(--body);letter-spacing:.28em;padding-left:.28em;color:#cbd5e1}
.logo b,.logo span,h1{text-shadow:0 2px 14px rgba(0,0,0,.55)}
h1{margin:24px 0 0;font:800 clamp(26px,8.4vw,33px)/1.05 var(--display)}
.role{margin-top:8px;font:700 15.5px var(--body)}
.tag{margin-top:6px;font:400 13.5px/1.45 var(--body);color:var(--soft);max-width:310px}
.pills{width:100%;display:grid;gap:12px;margin-top:20px}
.pill{position:relative;display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--white);color:var(--ink);
  text-decoration:none;font:600 16px var(--body);padding:0 44px;box-shadow:0 10px 24px -10px rgba(0,0,0,.55)}
.pill svg{position:absolute;left:20px;width:19px;height:19px;stroke:var(--ink)}
.pill.book{background:var(--acc);color:var(--white)}.pill.book svg{stroke:var(--white)}
.art{flex:1;position:relative}
.dots{position:absolute;left:0;right:0;top:16%;display:flex;justify-content:center;gap:clamp(12px,4.5vw,20px)}
.dot{width:44px;height:44px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.dot svg{width:20px;height:20px;stroke:var(--ink)}
svg{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.controls{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(100%,400px)}
.seg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.seg button{font:600 14px var(--body);color:var(--white);background:var(--chip);border:1px solid #2a376b;border-radius:999px;padding:10px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--ink);border-color:var(--chip-on)}
.hint{margin:0;font:400 13.5px/1.5 var(--body);color:var(--muted);text-align:center;text-wrap:balance}
</style>

  <div class="controls">
    <div class="seg" role="group" aria-label="Background">
      <button id="b-sun" aria-pressed="true">Sunrise</button>

      <button id="b-photo" aria-pressed="false">Living photo</button>
      <button id="b-still" aria-pressed="false">Today's card</button>
    </div>
    <p class="hint" id="hint">The sun rises over the hills, then clouds and birds drift by. Move your finger and the hills shift; tap the sky for a burst of sunlight. Tap Sunrise to watch it again.</p>

</div>

<script>
const phone=document.getElementById('phone'),cv=document.getElementById('waves'),g=cv.getContext('2d');
const photo=document.getElementById('photo'),img=document.getElementById('img'),glow=document.getElementById('glow'),hint=document.getElementById('hint');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,mode='sunrise',t0=performance.now();
const P={x:.5,y:.75,tx:.5,ty:.75,on:0,ton:0}; let ripples=[];
function size(){const r=phone.getBoundingClientRect();DPR=Math.min(3,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);}
new ResizeObserver(size).observe(phone);size();

function pos(e){const r=phone.getBoundingClientRect();P.tx=(e.clientX-r.left)/r.width;P.ty=(e.clientY-r.top)/r.height;P.ton=1;}
phone.addEventListener('pointermove',pos);
phone.addEventListener('pointerdown',e=>{pos(e);if(!e.target.closest('a')){ripples.push({x:P.tx,y:P.ty,t:performance.now()});flares.push(performance.now());}});
phone.addEventListener('pointerleave',()=>{P.ton=0;});

// Live ribbon: layered silk bands like the card's owned ribbon art, drawn fresh every frame.
const N=22;
const BAND=[[0,30,110],[0,42,150],[2,56,184],[6,74,214],[16,96,236],[38,126,250],[70,156,255]];
function waveY(i,x,t){
  const f=i/(N-1),base=H*(.58+f*.48);
  let y=base+Math.sin(x/W*2.2*Math.PI+t*.35+f*2.4)*H*.035*(1+f)
           +Math.sin(x/W*1.1*Math.PI-t*.22+f*5.1)*H*.05
           +Math.sin(x/W*4.0*Math.PI+t*.6-f*3)*H*.008;
  // rise toward the finger, more on the lines nearest it
  const dx=(x/W-P.x),near=Math.exp(-(dx*dx)/.05)*Math.exp(-Math.pow((base/H-P.y)*2.2,2));
  y-=near*P.on*H*.05;
  // ripples spread out from a tap
  const now=performance.now();
  for(const r of ripples){const age=(now-r.t)/1000,d=Math.hypot(x/W-r.x,(base/H-r.y)*.6),front=age*.55;
    y+=Math.sin((d-front)*28)*Math.exp(-Math.pow((d-front)*9,2))*Math.exp(-age*1.3)*H*.03;}
  return y;
}
function drawRibbon(t){
  const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#003cb5');sky.addColorStop(.55,'#0a2a9a');sky.addColorStop(1,'#020b3a');
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  const sg=g.createRadialGradient(W*.5,H*.18,0,W*.5,H*.18,W*.9);sg.addColorStop(0,'rgba(60,120,255,.35)');sg.addColorStop(1,'rgba(60,120,255,0)');
  g.fillStyle=sg;g.fillRect(0,0,W,H);
  const step=Math.max(4,W/90);
  for(let i=0;i<N;i++){
    const c=BAND[(i*3)%BAND.length],c2=BAND[(i*3+2)%BAND.length];
    g.beginPath();g.moveTo(0,H);
    for(let x=0;x<=W+step;x+=step)g.lineTo(x,waveY(i,x,t));
    g.lineTo(W,H);g.closePath();
    const yb=H*(.58+i/(N-1)*.48),gr=g.createLinearGradient(0,yb-H*.08,0,yb+H*.25);
    gr.addColorStop(0,`rgba(${c2[0]},${c2[1]},${c2[2]},.95)`);gr.addColorStop(.35,`rgba(${c[0]},${c[1]},${c[2]},.9)`);gr.addColorStop(1,'rgba(2,10,58,.98)');
    g.fillStyle=gr;g.fill();
    // thin sheen on every band's edge, a glowing lime line on a few
    g.beginPath();for(let x=0;x<=W+step;x+=step){const y=waveY(i,x,t);x?g.lineTo(x,y):g.moveTo(x,y);}
    if(i===3||i===9){g.save();g.shadowColor='rgba(170,255,120,.9)';g.shadowBlur=12;g.strokeStyle='rgba(200,255,150,.95)';g.lineWidth=1.6;g.stroke();g.restore();}
    else if(i===6||i===14){g.save();g.shadowColor='rgba(90,220,255,.8)';g.shadowBlur=10;g.strokeStyle='rgba(150,235,255,.85)';g.lineWidth=1.2;g.stroke();g.restore();}
    else{g.strokeStyle='rgba(160,200,255,.22)';g.lineWidth=1;g.stroke();}
  }
  // soft light under the finger
  if(P.on>.02){const lg=g.createRadialGradient(P.x*W,P.y*H,0,P.x*W,P.y*H,W*.35);lg.addColorStop(0,`rgba(120,180,255,${.22*P.on})`);lg.addColorStop(1,'rgba(120,180,255,0)');
    g.globalCompositeOperation='screen';g.fillStyle=lg;g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over';}
}
// Sunrise: dawn over layered hills. The sun climbs for about 14 seconds, then the day holds with drifting clouds and birds.
let sunStart=performance.now(),flares=[];
const lerp=(a,b,k)=>a+(b-a)*k,ease=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};
const mix=(c1,c2,k)=>`rgb(${lerp(c1[0],c2[0],k)|0},${lerp(c1[1],c2[1],k)|0},${lerp(c1[2],c2[2],k)|0})`;
const CLOUDS=[[.12,.60,1.0],[.62,.565,.75],[.95,.66,1.1],[.38,.69,.7],[.80,.625,.6]];
function hill(x,base,amp,f,ph){return base-amp*(Math.sin(x*f+ph)*.6+Math.sin(x*f*2.3+ph*1.7)*.3+Math.sin(x*f*5.1+ph*.4)*.1);}
function drawSunrise(t,now){
  const R=reduce?1:ease((now-sunStart)/14000);
  const sky=g.createLinearGradient(0,0,0,H*.9);
  sky.addColorStop(0,mix([16,32,92],[22,74,196],R));
  sky.addColorStop(.45,mix([52,62,140],[70,138,228],R));
  sky.addColorStop(.8,mix([214,112,104],[150,196,246],R));
  sky.addColorStop(1,mix([255,170,110],[255,226,170],R));
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  const sx=W*(.5+(P.x-.5)*.04*P.on),sy=lerp(H*.93,H*.775,R),sr=W*.085;
  // warm glow, kept light so the scene stays crisp
  const gl=g.createRadialGradient(sx,sy,0,sx,sy,W*.9);
  gl.addColorStop(0,'rgba(255,236,190,.5)');gl.addColorStop(.18,`rgba(255,200,130,${.26+.12*(1-R)})`);gl.addColorStop(.55,'rgba(255,170,120,.06)');gl.addColorStop(1,'rgba(255,170,120,0)');
  g.globalCompositeOperation='screen';g.fillStyle=gl;g.fillRect(0,0,W,H);
  g.save();g.translate(sx,sy);g.rotate(t*.02);
  for(let i=0;i<14;i++){g.rotate(Math.PI*2/14);const a=.035+.02*Math.sin(t*.7+i);
    const rg=g.createLinearGradient(0,0,W*1.1,0);rg.addColorStop(0,`rgba(255,230,170,${a})`);rg.addColorStop(1,'rgba(255,230,170,0)');
    g.fillStyle=rg;g.beginPath();g.moveTo(0,0);g.lineTo(W*1.1,-W*.05);g.lineTo(W*1.1,W*.05);g.closePath();g.fill();}
  g.restore();
  for(const f of flares){const age=(now-f)/1000,r=W*(.1+age*.9),a=Math.max(0,.35*(1-age/1.6));
    const fg=g.createRadialGradient(sx,sy,r*.6,sx,sy,r);fg.addColorStop(0,'rgba(255,220,160,0)');fg.addColorStop(.85,`rgba(255,225,170,${a})`);fg.addColorStop(1,'rgba(255,225,170,0)');
    g.fillStyle=fg;g.fillRect(0,0,W,H);}
  g.globalCompositeOperation='source-over';
  // the sun: a sharp, bright disc with a thin halo ring
  const ring=g.createRadialGradient(sx,sy,sr,sx,sy,sr*1.7);ring.addColorStop(0,'rgba(255,244,200,.45)');ring.addColorStop(1,'rgba(255,244,200,0)');
  g.fillStyle=ring;g.beginPath();g.arc(sx,sy,sr*1.7,0,7);g.fill();
  const sd=g.createRadialGradient(sx,sy-sr*.2,0,sx,sy,sr);sd.addColorStop(0,'#ffffff');sd.addColorStop(.7,'#fff6d0');sd.addColorStop(1,'#ffe49a');
  g.fillStyle=sd;g.beginPath();g.arc(sx,sy,sr,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=1.25;g.stroke();
  // clouds with clean edges: white on top, warm underneath
  for(const [cx0,cy,s] of CLOUDS){const cx=((cx0+t*.006*s)%1.3-.15)*W,base=H*cy,w=W*.15*s;
    g.save();g.beginPath();g.rect(cx-w*1.3,base-w,w*2.6,w);g.clip();
    g.beginPath();for(const [ox,rr] of [[-.78,.16],[-.48,.3],[-.1,.44],[.32,.34],[.66,.22],[.9,.12]]){const px=cx+ox*w;g.moveTo(px+rr*w,base);g.arc(px,base,rr*w,0,Math.PI*2);}
    const cg=g.createLinearGradient(0,base-w*.46,0,base);
    cg.addColorStop(0,`rgba(255,255,255,${lerp(.82,.97,R)})`);cg.addColorStop(.55,mix([255,222,208],[248,251,255],R).replace('rgb','rgba').replace(')',`,${lerp(.8,.95,R)})`));
    cg.addColorStop(1,mix([246,150,128],[206,224,250],R).replace('rgb','rgba').replace(')',',.9)'));
    g.fillStyle=cg;g.fill();g.restore();}
  // birds
  g.strokeStyle=`rgba(16,24,64,${lerp(.6,.78,R)})`;g.lineWidth=1.6;g.lineCap='round';
  for(let i=0;i<3;i++){const bx=((t*.018+i*.13+.2)%1.4-.2)*W,by=H*(.545+i*.022)+Math.sin(t*.8+i)*4,fl=Math.sin(t*6+i*2)*3,bw=6+i;
    g.beginPath();g.moveTo(bx-bw,by-fl);g.quadraticCurveTo(bx-bw*.4,by-2,bx,by);g.quadraticCurveTo(bx+bw*.4,by-2,bx+bw,by-fl);g.stroke();}
  // three layers of hills with a warm rim of light on each ridge; nearer ones move more with the finger
  const layers=[[.875,H*.03,4.2,1.1,[118,128,190],[150,170,214],6],[.92,H*.04,3.1,2.6,[58,66,136],[66,96,170],14],[.965,H*.045,2.3,4.0,[22,30,84],[24,44,110],24]];
  const step=Math.max(2,W/160);
  layers.forEach(([b,amp,f,ph,c1,c2,par],li)=>{const off=(P.x-.5)*-par*P.on,Y=x=>hill((x-off)/W,H*b,amp,f,ph);
    if(li===2){ // small pines along the nearest ridge
      g.fillStyle=mix([14,20,62],[16,34,88],R);
      for(let k=0;k<26;k++){const u=(Math.sin(k*12.9898)*43758.5453)%1,x=((k/26+Math.abs(u)*.03)%1)*W+off,hh=H*(.012+Math.abs(Math.sin(k*7.3))*.012),y=Y(x)+1;
        if(k%5===2||k%7===3)continue;
        g.beginPath();g.moveTo(x,y-hh);g.lineTo(x+hh*.36,y);g.lineTo(x-hh*.36,y);g.closePath();g.fill();}}
    g.beginPath();g.moveTo(0,H);for(let x=-step;x<=W+step;x+=step)g.lineTo(x,Y(x));g.lineTo(W,H);g.closePath();
    const hg=g.createLinearGradient(0,H*(b-.06),0,H);hg.addColorStop(0,mix(c1,c2,R));hg.addColorStop(1,'#0a1440');g.fillStyle=hg;g.fill();
    g.beginPath();for(let x=-step;x<=W+step;x+=step){const y=Y(x);x<0?g.moveTo(x,y):g.lineTo(x,y);}
    const rim=g.createLinearGradient(sx-W*.5,0,sx+W*.5,0);rim.addColorStop(0,'rgba(255,214,160,0)');rim.addColorStop(.5,`rgba(255,222,170,${[.75,.5,.3][li]})`);rim.addColorStop(1,'rgba(255,214,160,0)');
    g.strokeStyle=rim;g.lineWidth=1.3;g.stroke();});
  // keep the top calm and deep enough for white text
  const top=g.createLinearGradient(0,0,0,H*.5);top.addColorStop(0,'rgba(6,16,60,.35)');top.addColorStop(1,'rgba(6,16,60,0)');g.fillStyle=top;g.fillRect(0,0,W,H*.5);
}
// Living photo: today's owned ribbon picture, with depth that follows the finger and a slow light passing along the lines.
function drawPhoto(t){
  const dx=(P.x-.5)*-18*P.on+Math.sin(t*.15)*6,dy=(P.y-.6)*-12*P.on+Math.sin(t*.11)*5,s=1+Math.sin(t*.09)*.012;
  img.style.transform=`translate(${dx}px,${dy}px) scale(${s})`;
  const sx=((t*.08)%1.4-.2)*100;
  glow.style.background=`linear-gradient(115deg,transparent ${sx-12}%,rgba(140,190,255,.28) ${sx}%,transparent ${sx+12}%),radial-gradient(circle at ${P.x*100}% ${P.y*100}%,rgba(120,170,255,${.3*P.on}),transparent 38%)`;
}
function frame(now){
  const t=(now-t0)/1000;
  P.x+=(P.tx-P.x)*.08;P.y+=(P.ty-P.y)*.08;P.on+=(P.ton-P.on)*.06;
  ripples=ripples.filter(r=>now-r.t<3500);flares=flares.filter(f=>now-f<1600);
  if(mode==='sunrise')drawSunrise(reduce?0:t,now);else if(mode==='ribbon')drawRibbon(reduce?0:t);else if(mode==='photo')drawPhoto(reduce?0:t);
  if(!reduce)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(reduce)phone.addEventListener('pointermove',()=>requestAnimationFrame(frame));

const HINTS={sunrise:'The sun rises over the hills, then clouds and birds drift by. Move your finger and the hills shift; tap the sky for a burst of sunlight. Tap Sunrise to watch it again.',
  ribbon:'The waves drift on their own. Move your mouse or finger over the card and they rise toward you; tap the background to send a ripple.',
  photo:'Your current background picture, brought to life: it shifts with your finger for depth, and a soft light passes along the ribbons.',
  still:'This is how your card looks today, for comparison.'};
function set(m){mode=m;
  for(const [id,k] of [['b-sun','sunrise'],['b-ribbon','ribbon'],['b-photo','photo'],['b-still','still']])document.getElementById(id).setAttribute('aria-pressed',String(k===m));
  const canvasMode=m==='ribbon'||m==='sunrise';cv.hidden=!canvasMode;photo.hidden=canvasMode;if(m==='sunrise')sunStart=performance.now();
  img.style.transform='none';glow.style.background='none';hint.textContent=HINTS[m];if(reduce)requestAnimationFrame(frame);}
document.getElementById('b-sun').onclick=()=>set('sunrise');
document.getElementById('b-ribbon').onclick=()=>set('ribbon');
document.getElementById('b-photo').onclick=()=>set('photo');
document.getElementById('b-still').onclick=()=>set('still');
</script>
