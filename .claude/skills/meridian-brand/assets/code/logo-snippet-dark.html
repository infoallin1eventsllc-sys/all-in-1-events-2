<!-- Meridian Interface lockup — DARK backgrounds.
     Plain HTML, no build step, no image request. The mark is inline SVG so it
     stays sharp at any size.

     Use the file that matches your background: this one is for a dark surface.
     There is deliberately no light/dark toggle class — an SVG gradient inside a
     display:none element is a dead paint server, so a hidden mark silently
     blanks the visible one. Two files, one mark each, cannot fail that way.

     Pair with brand-tokens.css and set --m to the mark height; the wordmark,
     subtext, gap and clear space all scale off that one number.

     Putting BOTH lockups on one page is safe: their gradient ids differ (_l vs
     _d). Two copies of the SAME lockup is also safe. In React, use
     MeridianLogo.tsx instead — it generates unique ids per instance. -->
<link rel="stylesheet" href="brand-tokens.css">

<div class="meridian-lockup meridian-lockup--dark" style="--m: 36px">
  <svg class="meridian-lockup__mark" width="36" height="36" viewBox="0 0 100 100" fill="none"
       xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meridian Interface">
    <defs>
      <filter id="sh_d" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.2"/>
      </filter>
      
      <linearGradient id="stemL_d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/>
      </linearGradient>
      
      <linearGradient id="foldL_d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#94a3b8"/>
      </linearGradient>
      
      <linearGradient id="stemR_d" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e2e8f0"/><stop offset="50%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/>
      </linearGradient>
      
      <linearGradient id="foldR_d" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#cbd5e1"/><stop offset="60%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/>
      </linearGradient>
      
      <linearGradient id="needle_d" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#475569"/>
      </linearGradient>
    </defs>
    <line x1="50" y1="16" x2="50" y2="84" stroke="url(#needle_d)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 22 78 L 22 36 C 22 22, 34 22, 38 28 L 38 78 Z" fill="url(#stemL_d)"/>
    <path d="M 22 36 C 22 20, 36 20, 50 44 L 50 58 C 36 34, 28 32, 22 40 Z" fill="url(#foldL_d)" filter="url(#sh_d)"/>
    <path d="M 78 78 L 78 36 C 78 22, 66 22, 62 28 L 62 78 Z" fill="url(#stemR_d)"/>
    <path d="M 78 36 C 78 20, 64 20, 50 44 L 50 58 C 64 34, 72 32, 78 40 Z" fill="url(#foldR_d)" filter="url(#sh_d)"/>
  </svg>
  <div class="meridian-lockup__type">
    <span class="meridian-lockup__word">Meridian</span>
    <span class="meridian-lockup__sub">Interface</span>
  </div>
</div>
