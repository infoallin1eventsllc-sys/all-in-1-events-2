<!-- Meridian Interface lockup — plain HTML, no build step.

     The artwork is Otis's own transparent PNG. There is no inline-SVG version:
     the logo exists only as raster, so anything claiming to be a vector of it
     would be a redrawing, not the logo.

     Backgrounds matter here. The wordmark inside the file is near-black, so on
     a dark surface it disappears while the mark survives. Two safe options:

       1. Light or white ground  -> use this lockup directly.
       2. Dark ground            -> put it on a light plate (below), or use
                                    meridian-mark.png beside your own live text,
                                    which you can colour to suit.

     Sizing: set the width on the img; height follows. -->

<a href="https://meridianinterface.com" aria-label="Meridian Interface">
  <img src="meridian-lockup.png" alt="Meridian Interface"
       width="885" height="550" style="width:180px;height:auto;display:block">
</a>

<!-- On a dark background, wrap it: -->
<a href="https://meridianinterface.com" aria-label="Meridian Interface"
   style="display:inline-flex;background:#f1f5f9;border-radius:12px;padding:18px 24px">
  <img src="meridian-lockup.png" alt="Meridian Interface"
       width="885" height="550" style="width:132px;height:auto;display:block">
</a>
