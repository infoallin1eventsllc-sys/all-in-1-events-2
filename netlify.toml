# netlify.toml
# 
# Netlify deployment configuration for All in 1 Events
# 
# Handles:
# - Serverless function configuration
# - Security headers
# - Redirects
# - Build settings

[build]
  # The events site is static; the drone command app (drone/) is a Vite build.
  # scripts/build-site.mjs assembles both into _site/ (drone app at /drone/), so
  # only what visitors need is published: not system/, docs or sources.
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# ===== SECURITY HEADERS =====
# Common to every path.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The events pages. Their Content-Security-Policy is set per page rather than on
# "/*": Netlify applies every rule that matches, and a second CSP on /drone/
# would block the drone app's connections and push-to-talk.
# - img-src: Google's image CDN and data URIs
# - style-src: inline styles (Tailwind), Google Fonts
# - script-src: inline + the Tailwind CDN
# - connect-src: this site only (the concierge runs as a function here)
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://lh3.googleusercontent.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self'; form-action 'self' mailto:"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://lh3.googleusercontent.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self'; form-action 'self' mailto:"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/marketing-system.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://lh3.googleusercontent.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self'; form-action 'self' mailto:"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ===== FUNCTIONS =====
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ===== DRONE COMMAND APP =====
# The cockpit view uses the operator microphone for push-to-talk; allow it only here.
# Its own Content-Security-Policy: the patrol feed streams recorded drone footage
# from Pexels (media-src), and the console talks to Supabase, the relay and the
# companion computer (connect-src). CSP can't express network ranges, and the
# video streamer and bridge are wherever the pilot points them (https/wss, or
# localhost), so any https/wss endpoint is allowed.
[[headers]]
  for = "/drone/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: https://www.pexels.com https://videos.pexels.com https://player.vimeo.com https://*.vimeocdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; worker-src 'self' blob:; connect-src 'self' https: ws: wss: http://localhost:* http://127.0.0.1:*"

# ===== REDIRECTS =====
# The built drone app is copied to _site/drone/. Files are served as they are;
# any other /drone/ path falls back to the app (a non-forced rewrite only applies
# when no file matches).
[[redirects]]
  from = "/drone"
  to = "/drone/"
  status = 301

[[redirects]]
  from = "/drone/*"
  to = "/drone/index.html"
  status = 200

# ===== ENVIRONMENT VARIABLES =====
# The Event Concierge (netlify/functions/chat.js) reads ANTHROPIC_API_KEY.
# Set it in the Netlify dashboard (Site configuration → Environment variables),
# never in this file. Without it the chat falls back to scripted answers.
