# netlify.toml
# 
# Netlify deployment configuration for All in 1 Events
# 
# Handles:
# - Serverless function configuration
# - Security headers
# - Redirects
# - Build settings

[build]
  # The events site is static. The drone command app (drone/) is a Vite build
  # served under /drone/ — see the redirects below.
  command = "npm run build:drone"
  publish = "."

# ===== SECURITY HEADERS =====
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Content Security Policy
    # - default-src: restrict to same-origin
    # - img-src: allow images from Google's CDN and data URIs
    # - style-src: allow inline styles (Tailwind), Google Fonts
    # - script-src: allow inline + Tailwind CDN
    # - connect-src: allow Anthropic API
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://lh3.googleusercontent.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self' https://api.anthropic.com"
    
    # Permissions policy (formerly Feature Policy)
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ===== FUNCTIONS =====
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ===== DRONE COMMAND APP =====
# The cockpit view uses the operator microphone for push-to-talk; allow it only here.
# Its own Content-Security-Policy: the patrol feed streams recorded drone footage
# from Pexels (media-src), and the console talks to Supabase, the relay and the
# companion computer on the local network (connect-src).
[[headers]]
  for = "/drone/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: https://www.pexels.com https://videos.pexels.com https://player.vimeo.com https://*.vimeocdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; worker-src 'self' blob:; connect-src 'self' https://api.pexels.com https://*.supabase.co wss://*.supabase.co ws: wss: http://192.168.0.0/16 http://10.0.0.0/8 http://172.16.0.0/12"

# ===== REDIRECTS =====
# Serve the built drone app (drone/dist) at /drone/ with SPA fallback.
[[redirects]]
  from = "/drone"
  to = "/drone/"
  status = 301

[[redirects]]
  from = "/drone/*"
  to = "/drone/dist/:splat"
  status = 200

# ===== ENVIRONMENT VARIABLES =====
# Set ANTHROPIC_API_KEY in the Netlify dashboard:
# Site settings → Environment variables → Add new
# Key: ANTHROPIC_API_KEY
# Value: sk-ant-...
