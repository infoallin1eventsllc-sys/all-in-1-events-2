# Netlify deployment configuration — Secrets of Cint
# Static marketing site, no build step required.

[build]
  command = "echo 'Static site, no build needed'"
  publish = "."

# ===== SECURITY HEADERS =====
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"

# Assets keep their names when they change (the film, CSS/JS edits, photos the owner replaces via the portal ZIP),
# so browsers revalidate before reuse (cheap 304s via ETag) instead of holding a stale copy for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
