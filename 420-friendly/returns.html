<script src="assets/products.js"></script>
<script src="assets/app.js"></script>
<script src="assets/soundtrack.js"></script>
<script src="assets/policy.js"></script>
<script>
  renderChrome("SHOP ALL");
  renderPolicyPage({
    kicker: "RETURNS",
    title: "If it is not right",
    standfirst: "Small runs do not restock, which changes how returns work here. Read the second section before ordering a limited drop.",
    body:
      h("Standard items") +
      p("Return within <strong>" + POLICY.returnWindowDays + " days</strong> of delivery, " +
        esc(POLICY.returnCondition) + ". Refund lands " + esc(POLICY.refundDays) + ".") +
      h("Limited drops") +
      p("A limited drop is <strong>" + esc(POLICY.limitedDropRule) + "</strong>. When a run is gone it is gone, so we cannot " +
        "refund a piece back into stock that will not exist again. Exchange for a different size in the same piece, " +
        "subject to what is left.") +
      p("This is stated on every limited-drop product page before you buy, not discovered afterwards.") +
      h("What we cannot take back") +
      ul([
        "Worn or washed pieces.",
        "Anything without tags.",
        "Anything returned after the " + POLICY.returnWindowDays + "-day window."
      ]) +
      h("Who pays return postage") +
      p(POLICY.whoPaysReturn
        ? esc(String(POLICY.whoPaysReturn))
        : policyMissing("RETURN POSTAGE POLICY") +
          " — this decides whether the customer pays to send it back. It must be answered before the store takes orders.") +
      h("How to start one") +
      p("Email " + pv(POLICY.contactEmail, "CONTACT EMAIL") + " with your order number and what is wrong. " +
        "Do not post anything back before you hear from us — an unannounced parcel is hard to match to an order.") +
      h("Where returns go") +
      p(pv(POLICY.returnsAddress, "RETURNS ADDRESS"))
  });
</script>
