<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="420 Friendly">
  <title>420 Friendly</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e08d"/>
      <stop offset="45%" stop-color="#e9c349"/>
      <stop offset="100%" stop-color="#b8912a"/>
    </linearGradient>
  </defs>
  <!-- Ring behind the leaf -->
  <circle cx="100" cy="96" r="66" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.9"/>
  <!-- Cannabis leaf: 7 leaflets, outlined, mirrored about the vertical axis -->
  <g transform="translate(100,150)" fill="none" stroke="url(#gold)" stroke-width="5"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M0,0 C-17,-48 -10,-86 0,-112 C10,-86 17,-48 0,0 Z"/>
    <g transform="rotate(26)"><path d="M0,0 C-15,-42 -9,-75 0,-98 C9,-75 15,-42 0,0 Z"/></g>
    <g transform="rotate(-26)"><path d="M0,0 C-15,-42 -9,-75 0,-98 C9,-75 15,-42 0,0 Z"/></g>
    <g transform="rotate(52)"><path d="M0,0 C-13,-34 -8,-60 0,-79 C8,-60 13,-34 0,0 Z"/></g>
    <g transform="rotate(-52)"><path d="M0,0 C-13,-34 -8,-60 0,-79 C8,-60 13,-34 0,0 Z"/></g>
    <g transform="rotate(76)"><path d="M0,0 C-11,-26 -7,-45 0,-59 C7,-45 11,-26 0,0 Z"/></g>
    <g transform="rotate(-76)"><path d="M0,0 C-11,-26 -7,-45 0,-59 C7,-45 11,-26 0,0 Z"/></g>
  </g>
  <!-- Chevron wings flanking the base, as in the badge -->
  <path d="M52,132 L30,143 L52,154" fill="none" stroke="url(#gold)" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M148,132 L170,143 L148,154" fill="none" stroke="url(#gold)" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Sweep under the mark -->
  <path d="M40,176 C80,166 120,186 160,174" fill="none" stroke="url(#gold)" stroke-width="5"
        stroke-linecap="round" opacity="0.85"/>
</svg>
