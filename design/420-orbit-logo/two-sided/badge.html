<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const W = 900, H = 1080;
const data = await (await fetch('/shape.json')).json();
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(22, W/H, 0.1, 50); cam.position.set(0, 0, 6.4);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-2.5, 3, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xbfffd0, 1.1); rim.position.set(3, 1, -3); scene.add(rim);

const tex = await new THREE.TextureLoader().loadAsync('/face.jpg');
tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;
tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping; tex.repeat.set(0.5, 0.5); tex.offset.set(0.5, 0.5);
const toShape = pts => new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
const face = new THREE.MeshStandardMaterial({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.62,
  color: 0x8a8a8a, roughness: 0.38, metalness: 0.2, envMapIntensity: 0.55 });
const green = new THREE.MeshStandardMaterial({ color: 0x0e8a3a, roughness: 0.22, metalness: 0.92, envMapIntensity: 1.5 });
const silver = new THREE.MeshStandardMaterial({ color: 0xd4d7da, roughness: 0.2, metalness: 1.0, envMapIntensity: 1.3 });
const D = 0.13, CORE = 0.07, BV = 0.014;
const plateGeo = new THREE.ExtrudeGeometry(toShape(data.shape), { depth: D, bevelEnabled: true, bevelThickness: BV, bevelSize: BV, bevelOffset: -BV, bevelSegments: 3, curveSegments: 1 });
const badge = new THREE.Group();
const front = new THREE.Mesh(plateGeo, [face, green]); front.position.z = CORE/2;
const back = new THREE.Mesh(plateGeo, [face, green]); back.rotation.y = Math.PI; back.position.z = -CORE/2;
const coreGeo = new THREE.ExtrudeGeometry(toShape(data.core), { depth: CORE - 2*BV, bevelEnabled: true, bevelThickness: BV, bevelSize: BV, bevelOffset: -BV, bevelSegments: 3, curveSegments: 1 });
const core = new THREE.Mesh(coreGeo, silver); core.position.z = -(CORE - 2*BV)/2;
badge.add(front, back, core); scene.add(badge);

const eIO = u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3)/2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a)/(b - a)));
const DEG = Math.PI/180;
// angle over time: swing in to the front, turn to show the back, hold, come home
function angle(t){
  let a = -75 + 75*eOut(seg(t, 0, 0.9));
  a += 180*eIO(seg(t, 1.25, 2.55));
  a += 8*seg(t, 2.55, 3.45);                 // slow drift while the back faces the viewer
  a += 172*eIO(seg(t, 3.45, 4.75));
  const u = t - 4.75; if (u > 0) a += 5*Math.exp(-u*5)*Math.sin(u*9);
  return a;
}
window.__badge = { DUR: 5.6, W, H, draw(t){
  const a = angle(t);
  badge.rotation.y = a*DEG;
  badge.rotation.x = 5*DEG*Math.sin(a*DEG)*-1 + 2*DEG*Math.sin(t*1.3);
  badge.rotation.z = 3*DEG*Math.sin(a*DEG*0.5)*(1 - seg(t, 4.2, 5.2));
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
}};
</script></body></html>
