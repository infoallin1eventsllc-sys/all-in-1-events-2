    <g transform="translate(675, 512) scale(0.66)" stroke="{{green}}" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round">

<script data-dc-script data-props='{"green":{"editor":"color","default":"#2E7D4F","options":["#2E7D4F","#3E9B65","#1F6B41","#4CAF6E"],"section":"Brand"}}'>

  renderVals() {
