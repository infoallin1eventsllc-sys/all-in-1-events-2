<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Haven">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Haven</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card">
      <h1>Haven</h1>
      <p>Enter the owner token printed when the home server first started.</p>
      <input id="token-input" type="password" autocomplete="current-password" placeholder="Owner token" required>
      <button type="submit" class="primary">Connect</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <main id="app" hidden>
    <header class="top">
      <div>
        <h1 id="home-name">Haven</h1>
        <p id="subtitle" class="muted"></p>
      </div>
      <span id="conn" class="conn" title="Live connection">●</span>
    </header>

    <section id="pending" aria-live="assertive"></section>

    <section class="summary" id="summary" aria-label="House at a glance"></section>

    <section class="card ask">
      <form id="chat-form">
        <input id="chat-input" autocomplete="off" placeholder="Ask Haven… “turn off the kitchen lights”" aria-label="Ask Haven">
        <button class="primary" type="submit">Send</button>
      </form>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
    </section>

    <section>
      <h2>Scenes</h2>
      <div id="scenes" class="scenes"></div>
    </section>

    <section>
      <h2>Rooms</h2>
      <div id="rooms" class="rooms"></div>
    </section>

    <section>
      <div class="row-between">
        <h2>Updates</h2>
        <button id="brief-now" class="ghost">Brief me now</button>
      </div>
      <ol id="feed" class="feed"></ol>
    </section>

    <section id="sim" class="card sim" hidden>
      <h2>Simulator</h2>
      <p class="muted">No hardware connected. Trigger sensors to see Haven react.</p>
      <div class="sim-grid" id="sim-buttons"></div>
    </section>

    <footer class="muted small" id="footer"></footer>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
