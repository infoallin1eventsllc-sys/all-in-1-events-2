name: Fetch media into the repo

# Downloads a media file from a URL (for example a finished render in the
# agency's Higgsfield library) and commits it to the branch the workflow runs
# on. Used when a cloud session cannot reach the media host itself.
#
# The inputs reach the shell only through environment variables. Writing
# `${{ inputs.* }}` inside `run:` lets a crafted URL or path run as shell
# before the script starts (GitHub expands it first), so it must not appear
# there. The destination must be a plain relative path, so `..`, an absolute
# path or .git/.github cannot write or commit outside the working tree.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "HTTPS URL of the file to fetch"
        required: true
        type: string
      dest:
        description: "Path inside the repository to write it to"
        required: true
        type: string
        default: marketing/film/higgsfield/master.mp4

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url }}
      DEST: ${{ inputs.dest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Check inputs
        run: |
          case "$URL" in
            https://*) ;;
            *) echo "url must start with https://" >&2; exit 1 ;;
          esac
          case "$DEST" in
            /*|.git/*|.github/*) echo "dest must be a relative path outside .git/ and .github/" >&2; exit 1 ;;
          esac
          case "/$DEST/" in
            */../*|*/./*|*//*) echo "dest must not contain '..', '.' or empty segments" >&2; exit 1 ;;
          esac
          if ! printf '%s' "$DEST" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "dest may only use letters, digits, '.', '_', '-' and '/'" >&2
            exit 1
          fi
      - name: Download
        run: |
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' \
            --max-filesize 524288000 -o "$DEST" "$URL"
          ls -la "$DEST"
          file "$DEST"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DEST"
          git commit -m "Fetch $DEST from its media host" || echo "nothing to commit"
          git push
